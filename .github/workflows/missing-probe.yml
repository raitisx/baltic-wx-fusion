name: probe-missing
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install -r requirements.txt && pip install numpy scipy scikit-image pillow pyproj boto3 requests
      - name: Nordic radar archive depth
        run: python jobs/probe_nordic_archive.py
