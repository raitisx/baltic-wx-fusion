name: grid-fill
# Background fill grid for the fused map: one Open-Meteo pass a day over the
# points that plug the gaps between stations, parked in R2 as Parquet.
#
# Its own hour, on purpose. The station ingest (models.yml) spends ~2,600
# weighted Open-Meteo calls in each of its 04:20 and 16:20 runs, and the free
# tier caps at 5,000/hour; this pass spends ~3,900 more, so it sits at 08:20 —
# clear of both — and the day totals ~9,200 of the 10,000/day cap.
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      max_points:
        description: "cap on fill points (blank = default 900 ~ 0.22 deg)"
        type: string
        default: ""

concurrency:
  group: grid-fill
  cancel-in-progress: false

jobs:
  grid-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt && pip install pyproj scipy numpy pyarrow boto3 matplotlib pillow
      - name: Fill grid -> R2 Parquet
        # Best-effort, exactly like the station ingest: a throttled Open-Meteo
        # pass leaves yesterday's map data in place rather than reddening CI.
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          GRID_FILL_MAX_POINTS: ${{ inputs.max_points }}
        run: python jobs/run_grid_fill.py
      - name: Fused map -> R2
        # The 1:1 fused map: the freshly filled blend, rendered on the grid.
        # Best-effort so a slow render never reddens the daily pass.
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_fused_map.py
