name: backfill
# One manual workflow for every "fill in history" job. Pick a target, set the
# knobs that target uses, run it. Nothing here is scheduled.
#
# The run name carries the target because the API does not: a workflow_dispatch
# run reports which FILE ran, never which inputs it ran with. Without this the
# jobs drawer showed one dispatch as thirteen, since all thirteen backfill rows
# are the same file.
run-name: "backfill · ${{ inputs.target }}"
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to backfill"
        type: choice
        options:
          - radar-maps
          - meps-maps
          - meps-grid
          - meps-static
          - station-obs
          - forecast-archive
          - obs-archive
          - um-archive
          - um-maps
          - gfs-maps
          - radar-verify
          - stations
          - radar-calibrate
          - radar-sources
          - radar-render
          - pairs-archive
          - pair-stats
          - meteogram
          - pairing-r2
          - radar-diag
          - radar-render-one
          - radar-snapshot
          - static-grid
          - fused-map
        default: radar-maps
      hours:
        description: "radar-maps: how many hours back (meteolapa archive reaches back months)"
        type: string
        default: "168"
      force:
        description: "radar-maps / meps-maps: re-render hours already archived (apply new styling/cleaning)"
        type: boolean
        default: false
      days:
        description: "meps-maps: how many days of history to re-render from the MET archive (0 = today only)"
        type: string
        default: "0"
      runs:
        description: "meps-maps: how many past MEPS runs to render from the live catalog"
        type: string
        default: "12"
      lvgmc:
        description: "station-obs: pull the LVGMC ~365-day archive"
        type: boolean
        default: true
      metar_start:
        description: "station-obs: METAR start date (YYYY-MM-DD, empty = skip)"
        type: string
        default: ""
      metar_end:
        description: "station-obs: METAR end date (YYYY-MM-DD, empty = today)"
        type: string
        default: ""
      lt_days:
        description: "station-obs: meteo.lt days of history (0 = skip)"
        type: string
        default: "0"
      grid_from:
        description: "meps-grid: first day to fetch (YYYY-MM-DD)"
        type: string
        default: ""
      grid_to:
        description: "meps-grid: last day to fetch (YYYY-MM-DD)"
        type: string
        default: ""
      only_missing:
        description: "forecast-archive: skip runs already present in R2"
        type: boolean
        default: true
      obs_prune:
        description: "obs-archive: delete hot rows past the window once archived"
        type: boolean
        default: true
      pairs_prune:
        description: "pairs-archive: delete rows once the R2 file is confirmed (off while the project is read-only)"
        type: boolean
        default: false
      stats_from:
        description: "pair-stats: first day to re-total from the R2 archive (YYYY-MM-DD, empty = 30 days back)"
        type: string
        default: ""
      stats_to:
        description: "pair-stats: last day (YYYY-MM-DD, empty = yesterday)"
        type: string
        default: ""
      mg_points:
        description: "meteogram: limit to these point_ids (comma list, empty = all)"
        type: string
        default: ""
      mg_keep:
        description: "meteogram: rolling days published per point (empty = 21)"
        type: string
        default: ""
      diag_ts:
        description: "radar-diag / radar-render-one: frame to examine or re-render, UTC (e.g. 2026-08-11T17:00)"
        type: string
        default: ""
      dem_url:
        description: "static-grid: https URL of a DEM GeoTIFF (blank = read r2 assets/dem/baltic_dem.tif, then elevation API)"
        type: string
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          case "${{ inputs.target }}" in
            radar-maps)       pip install pillow numpy pyproj scipy scikit-image ;;
            meps-maps)        pip install netCDF4 matplotlib numpy pillow pyproj ;;
            meps-grid)        pip install netCDF4 matplotlib numpy pillow pyproj boto3 ;;
            meps-static)      pip install netCDF4 numpy pillow pyproj scipy boto3 ;;
            forecast-archive) pip install pyarrow boto3 ;;
            obs-archive)      pip install pyarrow boto3 ;;
            um-archive)       pip install boto3 ;;
            um-maps)          pip install pillow numpy pyproj boto3 ;;
            # scipy for the feather in maps_gfs._to_3059 — without it the
            # frames still draw, just bilinear and slightly creased.
            gfs-maps)         pip install eccodes matplotlib numpy pillow pyproj boto3 scipy ;;
            radar-verify)     pip install pillow numpy pyproj boto3 ;;
            stations)         pip install psycopg[binary] ;;
            radar-calibrate)  pip install pillow numpy pyproj boto3 psycopg[binary] ;;
            radar-sources)    pip install pillow numpy pyproj boto3 ;;
            radar-render)     pip install pillow numpy pyproj boto3 scipy scikit-image ;;
            pairs-archive)    pip install pyarrow boto3 ;;
            pair-stats)       pip install pyarrow boto3 psycopg[binary] ;;
            meteogram)        : ;;   # psycopg + boto3 already in requirements.txt
            pairing-r2)       pip install duckdb pyarrow pytz ;;  # + psycopg/boto3 from requirements
            radar-diag)       pip install pillow numpy pyproj scipy scikit-image boto3 ;;
            radar-render-one) pip install pillow numpy pyproj scipy scikit-image boto3 ;;
            radar-snapshot)   pip install pillow numpy pyproj scipy scikit-image boto3 ;;
            static-grid)      pip install shapely scipy matplotlib numpy pyproj boto3 rasterio ;;
            fused-map)        pip install psycopg[binary] pyarrow numpy scipy matplotlib pillow pyproj boto3 ;;
          esac

      - name: Radar map backfill -> R2
        if: inputs.target == 'radar-maps'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          BACKFILL_HOURS: ${{ inputs.hours }}
          BACKFILL_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python jobs/run_radar_backfill.py

      - name: MEPS map backfill -> R2
        if: inputs.target == 'meps-maps'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          MEPS_RUNS: ${{ inputs.runs }}
          MEPS_DAYS: ${{ inputs.days }}
          BACKFILL_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python jobs/run_meps_backfill.py

      # The year of MEPS fields, in chunks. A month a run is comfortable;
      # a year in one go would outlast the job timeout.
      - name: MEPS grid archive -> R2
        if: inputs.target == 'meps-grid'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          GRID_FROM: ${{ inputs.grid_from }}
          GRID_TO: ${{ inputs.grid_to }}
          GRID_RENDER_DAYS: "0"
        run: python jobs/run_meps_grid.py

      # One-off: the reprojection table and border mask the edge renderer uses.
      - name: MEPS static assets -> R2
        if: inputs.target == 'meps-static'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_meps_static.py

      - name: Station observation backfill -> Supabase
        if: inputs.target == 'station-obs'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.lvgmc }}" = "true" ]; then ARGS="$ARGS --lvgmc"; fi
          if [ -n "${{ inputs.metar_start }}" ]; then ARGS="$ARGS --metar-start ${{ inputs.metar_start }}"; fi
          if [ -n "${{ inputs.metar_end }}" ]; then ARGS="$ARGS --metar-end ${{ inputs.metar_end }}"; fi
          if [ "${{ inputs.lt_days }}" != "0" ]; then ARGS="$ARGS --lt-days ${{ inputs.lt_days }}"; fi
          echo "Running: python jobs/run_backfill.py $ARGS"
          python jobs/run_backfill.py $ARGS

      - name: Forecast run archive -> R2 Parquet
        if: inputs.target == 'forecast-archive'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          ARCHIVE_ONLY_MISSING: ${{ inputs.only_missing && '1' || '0' }}
        run: python jobs/run_forecast_archive.py

      - name: Observation day archive -> R2 Parquet
        if: inputs.target == 'obs-archive'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          OBS_ARCHIVE_ALL: "1"
          OBS_KEEP_DAYS: "90"
          OBS_PRUNE: ${{ inputs.obs_prune && '1' || '0' }}
        run: python jobs/run_obs_archive.py

      # The twice-daily pass is the normal route. This is for after a fix, or
      # when a pass landed on a cycle meteo.pl had not published yet.
      - name: UM (meteo.pl) map scrape -> R2
        if: inputs.target == 'um-maps'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_um_maps.py

      - name: Rebuild UM archive index from bucket contents
        if: inputs.target == 'um-archive'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_um_reindex.py

      - name: GFS long-range maps -> R2
        if: inputs.target == 'gfs-maps'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_gfs_maps.py

      - name: Radar verification backfill -> observations
        if: inputs.target == 'radar-verify'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          RADAR_VERIFY_HOURS: ${{ inputs.hours }}
        run: python jobs/run_radar_verify.py

      - name: Station coordinates -> wx.points
        if: inputs.target == 'stations'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python jobs/run_stations.py

      - name: Radar calibration against rain gauges
        if: inputs.target == 'radar-calibrate'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CAL_HOURS: ${{ inputs.hours }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_radar_calibrate.py

      - name: Radar sources -> R2 (originals, kept a year)
        if: inputs.target == 'radar-sources'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          RADAR_STORE_HOURS: ${{ inputs.hours }}
        run: python jobs/run_radar_store.py

      - name: Radar composites from the stored originals
        if: inputs.target == 'radar-render'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          RADAR_RENDER_HOURS: ${{ inputs.hours }}
          RADAR_RENDER_FORCE: ${{ inputs.force && '1' || '' }}
        run: python jobs/run_radar_render.py

      - name: Move stored comparisons to R2, then free the space
        if: inputs.target == 'pairs-archive'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          PAIRS_PRUNE: ${{ inputs.pairs_prune && '1' || '0' }}
        run: python jobs/run_pairs_archive.py

      # Read-only beam-detector diagnosis for one frame: fetch its source
      # overlays and log why each feed's beam detector did or did not fire.
      # Writes nothing; used to tune the beam thresholds against a known miss.
      - name: Radar beam-detector diagnosis
        if: inputs.target == 'radar-diag'
        env:
          RADAR_DIAG_TS: ${{ inputs.diag_ts }}
          RADAR_BEAM_DEBUG: "1"
        run: python jobs/run_radar_beam_diag.py

      # Force re-render one hour with the current cleaning, updating only that
      # hour's archive entry — for eyeballing a beam/cleaning fix on a single
      # frame before re-rendering any history.
      - name: Radar single-hour re-render
        if: inputs.target == 'radar-render-one'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          RADAR_RENDER_TS: ${{ inputs.diag_ts }}
        run: python jobs/run_radar_render_one.py

      # Render the current (or RADAR_SNAP_TS) composite RAW vs CLEAN and print
      # both as base64 PNG into the log, so the frame can be inspected from a box
      # that cannot reach R2. Writes nothing.
      - name: Radar beam before/after snapshot
        if: inputs.target == 'radar-snapshot'
        env:
          RADAR_SNAP_TS: ${{ inputs.diag_ts }}
        run: python jobs/run_radar_beam_snapshot.py

      # Render the 1:1 fused map from the existing fill grid + station
      # forecasts (no Open-Meteo pass) — for iterating on the render.
      - name: Fused map -> R2
        if: inputs.target == 'fused-map'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_fused_map.py

      # Build the downscaler's static geography grid (land/sea/lake, coast
      # distance, elevation, TPI) and print each layer as base64 for review.
      - name: Static geography grid -> R2
        if: inputs.target == 'static-grid'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          DEM_URL: ${{ inputs.dem_url }}
        run: python jobs/build_static_grid.py

      # Read-only against R2, and it can only raise a daily total, never lower
      # one — so it is safe to run whenever the totals look thin.
      - name: Rebuild the daily totals from the archived comparisons
        if: inputs.target == 'pair-stats'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          PAIR_STATS_FROM: ${{ inputs.stats_from }}
          PAIR_STATS_TO: ${{ inputs.stats_to }}
        run: python jobs/rebuild_pair_stats.py

      # Republish per-point meteogram history to R2. Read-only against Postgres
      # and additive against the bucket, so safe to run whenever; a subset of
      # points can be named to check the files against the RPCs first.
      - name: Publish per-point meteogram history to R2
        if: inputs.target == 'meteogram'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          METEOGRAM_POINTS: ${{ inputs.mg_points }}
          METEOGRAM_KEEP_DAYS: ${{ inputs.mg_keep || '21' }}
          # Verify the public read path after a full run (auto-skips when
          # mg_points limits it to a sample that was not fully written).
          METEOGRAM_VERIFY: "1"
        run: python jobs/publish_meteogram.py

      # Read-only: does pairing from the R2 archive reproduce the daily totals
      # that pairing from forecasts_h gives? The gate the truncate waits on.
      - name: Pairing R2 parity check
        if: inputs.target == 'pairing-r2'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/pair_r2_parity.py
