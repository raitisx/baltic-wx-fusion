name: meps-backfill
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many past MEPS runs to render (thredds keeps ~1 day)"
        type: string
        default: "12"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install netCDF4 matplotlib numpy pillow pyproj
      - name: MEPS past-run backfill -> R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          MEPS_RUNS: ${{ inputs.runs }}
        run: python jobs/run_meps_backfill.py
