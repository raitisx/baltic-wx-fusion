name: nordic-backfill
on:
  workflow_dispatch:
    inputs:
      se_days:
        description: "Days of SMHI history to backfill (0 = today only)"
        default: "14"
      fi_days:
        description: "Days of FMI history to backfill (0 = today only; WFS ~7 d, S3 mirror beyond)"
        default: "14"
      se_overwrite:
        description: "Re-decode SE frames that are already stored (after an SMHI_DBZ_ADJ change)"
        default: "0"
      fi_overwrite:
        description: "Re-decode FI frames that are already stored (after an FMI calibration change)"
        default: "0"
      render_hours:
        description: "Hours to force re-render after the backfill"
        default: "336"
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt && pip install pillow numpy pyproj scipy scikit-image rasterio
      - name: Backfill SE + FI sweeps (level pngs only)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          NORDIC_SE_DAYS: ${{ github.event.inputs.se_days || '14' }}
          NORDIC_FI_DAYS: ${{ github.event.inputs.fi_days || '14' }}
          NORDIC_SE_OVERWRITE: ${{ github.event.inputs.se_overwrite || '0' }}
          NORDIC_FI_OVERWRITE: ${{ github.event.inputs.fi_overwrite || '0' }}
        run: python jobs/run_nordic_backfill.py
      - name: Re-render composites with the new layers
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          RADAR_RENDER_HOURS: ${{ github.event.inputs.render_hours || '336' }}
          RADAR_RENDER_FORCE: "1"
        run: python jobs/run_radar_render.py
