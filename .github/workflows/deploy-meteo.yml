name: deploy-meteo
# Deploys the meteo-dashboard Worker (ttaero.lv/meteo) from worker/meteo-dashboard.
# Runs on a GitHub runner, which can reach the Cloudflare API directly.
#
# One-time setup — add two repo secrets:
#   CLOUDFLARE_API_TOKEN   token with, on the ttaero.lv zone:
#                            Account > Workers Scripts : Edit
#                            Zone    > Workers Routes  : Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the baltic-wx bucket + ttaero.lv
#
# Then run this workflow (Actions > deploy-meteo > Run workflow). The bucket
# binding and routes live in worker/meteo-dashboard/wrangler.toml.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker
        working-directory: worker/meteo-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
