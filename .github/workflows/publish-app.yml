name: publish-app
on:
  push:
    paths:
      - "docs/*.html"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install boto3
      - name: Upload app pages to public bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client("s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto")
          args = {"ContentType": "text/html; charset=utf-8",
                  "CacheControl": "public, max-age=120, must-revalidate"}
          # The main page lives at app/index.html: the Workers map "/" and
          # "/index.html" to that key. Every other page is uploaded under its
          # own name at the bucket ROOT, because both Workers proxy
          # "/<anything>" to "<anything>" verbatim — so a new page is reachable
          # the moment it is uploaded, with no Worker redeploy.
          for src, key in (("docs/index.html", "app/index.html"),
                           ("docs/radar_feeds.html", "radar_feeds.html")):
              s3.upload_file(src, "baltic-wx", key, ExtraArgs=args)
              print("published", key)
          EOF
