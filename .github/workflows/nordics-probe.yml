name: probe-nordics
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install requests pillow numpy rasterio pyproj
      - name: Evaluate SMHI + FMI access and classification
        run: python jobs/probe_nordics.py
