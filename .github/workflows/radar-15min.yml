name: radar-15min
on:
  schedule:
    - cron: "*/15 * * * *"   # best effort; GH Actions jitter applies
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # experimental — never page on ORD hiccups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install pillow numpy pyproj
      - name: Radar composites (meteolapa + OPERA) -> R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python jobs/run_radar.py
