name: meps-probe
# Throwaway: dump the MEPS OPeNDAP variable inventory so we can wire a cloud-top
# field. Delete this workflow and jobs/probe_meps_vars.py once done.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cloud_top_cells.json is live on the public bucket
        run: |
          curl -sS -o ct.json "https://pub-29a41af0b6de4fe9a0d144b6a88fa144.r2.dev/maps/meps/cloud_top_cells.json"
          python - <<'PY'
          import json
          d=json.load(open('ct.json'))
          print("keys", list(d.keys()))
          print("run", d.get("run"), "hours", len(d.get("hours",[])),
                "nx/ny", d.get("nx"), d.get("ny"), "step_m", d.get("top_step_m"),
                "top-hours", len(d.get("top",{})))
          top=d.get("top",{})
          if top:
              h=sorted(top,key=int)[0]; v=[x*100 for x in top[h].values()]
              vs=sorted(v)
              print("first top-hour", h, "cells", len(v),
                    "min_m", vs[0], "median_m", vs[len(vs)//2], "max_m", vs[-1])
          PY
