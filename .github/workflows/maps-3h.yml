name: maps-3h
on:
  schedule:
    - cron: "50 */3 * * *"   # MEPS runs every 3 h; render ~when a new run lands
  workflow_dispatch:

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install netCDF4 matplotlib numpy pillow
      - name: Render MEPS flight maps -> R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_maps.py
      - name: Scraped UM (meteo.pl) frames -> R2
        continue-on-error: true   # advisory layer, never blocks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_um_maps.py
