name: ingest-hourly
on:
  schedule:
    - cron: "7 * * * *"   # hh:07 UTC — off the top-of-hour GH congestion
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Observations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python jobs/run_observations.py
      - name: Forecasts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python jobs/run_forecasts.py
      # Baseline radar cadence: GitHub throttles the */15 cron badly, so the
      # hourly workflow (which fires reliably) also refreshes the composite.
      - name: Radar composite (baseline hourly)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: pip install pillow numpy pyproj scipy scikit-image -q && python jobs/run_radar.py
