name: tick
# Hourly "what is actually happening" pass. Everything here is either
# snapshot-only upstream (LVGMC operative returns the last hour; the Estonian
# XML feed has no history endpoint at all — a missed hour is lost forever) or
# wanted live (radar). Nothing here is expensive: ~2 min a run.
#
# Model products (forecast ingest, MEPS/UM map rendering, pairing) live in
# models.yml on a 2x/day cadence — see that file.
on:
  schedule:
    - cron: "7 * * * *"   # hh:07 UTC — off the top-of-hour GH congestion
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        # Deliberately no netCDF4/matplotlib here — those are only needed for
        # map rendering and would add ~30 s to every hourly run.
        run: pip install -r requirements.txt && pip install pillow numpy pyproj scipy scikit-image

      # GitHub delays scheduled runs heavily on this repo — the twice-daily
      # models workflow has fired as much as 90 min late, and a missed pass
      # leaves the maps on yesterday's model run, where the current day is
      # only covered every 3 h instead of hourly. The hourly tick fires far
      # more reliably, so let it notice and repair that. Normally this is one
      # small JSON GET and nothing else runs.
      - name: Map staleness check
        id: stale
        continue-on-error: true
        run: python jobs/check_maps_stale.py

      - name: Observations
        # METAR (incl. the only observed cloud base), LVGMC, meteo.lt, EE XML.
        # Each source is isolated inside the script; one dead feed is not fatal.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python jobs/run_observations.py

      # always(): a Supabase blip must not take the radar pipeline down with it.
      - name: Radar composite
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_radar.py
      - name: Radar archive top-up (recent hours)
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          BACKFILL_HOURS: "12"  # near-free: hours already covered are skipped,
                                # and 12 h means a throttled cron's gap is
                                # repaired within the hour, not next sweep
        run: python jobs/run_radar_backfill.py

      # Hours the page asked for that have no frames. Usually nothing to do.
      - name: Requested map hours
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: |
          pip install netCDF4 matplotlib >/dev/null
          python jobs/run_map_requests.py

      # Only when the models pass was missed. Costs nothing on a normal tick.
      - name: Map dependencies (stale only)
        if: always() && steps.stale.outputs.maps == '1'
        run: pip install netCDF4 matplotlib
      - name: MEPS maps (stale catch-up)
        if: always() && steps.stale.outputs.maps == '1'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_maps.py
      - name: UM maps (stale catch-up)
        if: always() && steps.stale.outputs.maps == '1'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_um_maps.py
