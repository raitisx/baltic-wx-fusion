# Regression suite for the radar beam cleaning. Run it after ANY change to the
# beam gates or passes in wxfusion/scrape_maps.py — it replays every recorded
# cone sighting (and the real-weather cases the cleaning must not eat) from the
# stored source overlays. See jobs/check_beam_cases.py for the case book.
name: beam-cases
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install -r requirements.txt && pip install numpy scipy scikit-image pillow pyproj boto3 requests
      - name: Replay recorded beam cases
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/check_beam_cases.py
