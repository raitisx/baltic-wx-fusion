name: models
# Twice-daily model pass: forecast ingest, map rendering, and the nightly
# verification pairing.
#
# 04:20 and 16:20 UTC land shortly after the 00Z and 12Z runs publish, so each
# pass picks up fresh model data. The meteogram page does not depend on this
# for freshness — it fetches Open-Meteo directly in the browser for the current
# and future hours and uses the database only for hours already in the past.
# What the database pass is really for is the archive: the stored forecast per
# lead is what "why we didn't fly" reports and the skill weights are built on.
on:
  schedule:
    - cron: "20 4,16 * * *"
  workflow_dispatch:
    inputs:
      pairing:
        description: "Run the forecast x observation pairing on this run"
        type: boolean
        default: false

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt && pip install netCDF4 matplotlib numpy pillow pyproj scipy scikit-image pyarrow eccodes duckdb pytz

      - name: Cadence gate
        id: gate
        run: |
          H=$(date -u +%-H)
          if [ "${{ inputs.pairing }}" = "true" ] || [ "$H" -lt 12 ]; then
            echo "pairing=1" >> "$GITHUB_OUTPUT"; else echo "pairing=0" >> "$GITHUB_OUTPUT"; fi
          # Radar calibration once a day. It walks every raining hour of the
          # last day and reads up to six frames per hour per feed, so it is not
          # something to do on the hourly tick.
          if [ "$H" -lt 12 ]; then
            echo "calibrate=1" >> "$GITHUB_OUTPUT"; else echo "calibrate=0" >> "$GITHUB_OUTPUT"; fi

      - name: Forecasts (hot tier + R2 archive + prune)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          # Down from 14. Nothing needs the fortnight any more: the page reads
          # its history from R2, and pairing reads its runs from the R2 archive
          # (PAIR_FCST_SOURCE=r2). All the hot table still feeds is the meteogram
          # publish, which only refreshes the last few days over the rolling R2
          # files. Three days is that, plus slack for a throttled pass. The full
          # run history stays in R2; this is only the hot mirror.
          FORECAST_KEEP_DAYS: "3"
        run: python jobs/run_forecasts.py
      - name: Observation archive + prune
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          # Down from 90. The page reads observation history from R2 now, and
          # pairing (3-day window) and radar calibration (30 h) need only days.
          # Sixteen covers the oldest week the page can page to; the archive
          # keeps the full ninety-plus in R2.
          OBS_KEEP_DAYS: "16"
          OBS_ARCHIVE_DAYS: "3"
          OBS_ARCHIVE_MAX: "40"
        run: python jobs/run_obs_archive.py

      # Side channel, like the fog cells: republish each point's forecast and
      # observation history to R2 in the exact shape the page's wx_point_window
      # / wx_point_obs_window RPCs return. Once the page reads these the hot
      # tables no longer have to hold a fortnight for it, which is most of what
      # fills the database. Reads only — additive until phases 2 and 4.
      - name: Publish per-point meteogram history to R2
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          # Self-check: fetch the published files over the public URL and
          # confirm they equal the page's RPCs. continue-on-error keeps a
          # verify blip from failing the pass, but it shows up red in the step.
          METEOGRAM_VERIFY: "1"
        run: python jobs/publish_meteogram.py

      # Must precede pairing: it is what precipitation gets scored against.
      - name: Radar verification (radar -> point observations)
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RADAR_VERIFY_HOURS: "48"
        run: python jobs/run_radar_verify.py

      # Compare, rank, snapshot the ranking, then drop old comparisons.
      - name: Verification (once a day, morning pass)
        if: always() && steps.gate.outputs.pairing == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PAIR_KEEP_DAYS: "60"
        run: python jobs/run_pairing.py

      # Keep the last fortnight of frames drawable without touching thredds,
      # and roll the three windows forward: grids at a year, frames at two
      # weeks, on-demand renders at a day.
      - name: MEPS grid store + retention
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          GRID_FROM: ""
          GRID_TO: ""
          GRID_PRUNE: "1"
        run: python jobs/run_meps_grid.py

      - name: MEPS maps
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_maps.py
      # Days 3-7: MEPS stops at +66 h, GFS carries a gridded ceiling much
      # further. Same palette and thresholds, so the column reads continuously.
      - name: GFS long-range maps
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_gfs_maps.py

      - name: UM (meteo.pl) maps
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_um_maps.py

      # Deeper radar sweep than the hourly top-up, so any hour the hourly tick
      # missed (throttled cron, upstream lag) still gets an aligned frame.
      - name: Radar archive sweep
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
          BACKFILL_HOURS: "18"
        run: python jobs/run_radar_backfill.py

      # Yesterday's rain, paired with the colour each national radar was
      # painting over each gauge. The tables this builds are what stops the
      # three feeds being read on three different scales; they are empty at
      # first and fill in as weather happens, so this wants to run every day
      # rather than once.
      - name: Radar calibration against rain gauges
        if: always() && steps.gate.outputs.calibrate == '1'
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CAL_HOURS: "30"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: baltic-wx
        run: python jobs/run_stations.py && python jobs/run_radar_calibrate.py
