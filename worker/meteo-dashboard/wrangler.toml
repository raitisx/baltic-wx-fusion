# Cloudflare Worker that publishes the Baltic weather page at ttaero.lv/meteo,
# reading the page and its imagery/data straight from the baltic-wx R2 bucket.
#
# Deploy:  cd worker/meteo-dashboard && npx wrangler deploy
# Needs a CLOUDFLARE_API_TOKEN with Workers Scripts:Edit and Workers Routes:Edit
# on the ttaero.lv zone (and CLOUDFLARE_ACCOUNT_ID), or an interactive
# `wrangler login`.

name = "meteo-dashboard"
main = "worker.js"
compatibility_date = "2025-08-01"
workers_dev = false

# Bind the existing bucket the models/maps jobs already write to. No data is
# copied; the worker streams objects straight out of it.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "baltic-wx"

# Path-based mount on the apex domain. Two patterns so /meteo and everything
# under /meteo/ are both handled, and nothing else on ttaero.lv is touched.
[[routes]]
pattern = "ttaero.lv/meteo"
zone_name = "ttaero.lv"

[[routes]]
pattern = "ttaero.lv/meteo/*"
zone_name = "ttaero.lv"
